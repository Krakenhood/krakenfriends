<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#2aa6a0"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aa6a0"/><stop offset="1" stop-color="#7c5be0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1f3b4d"/><stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="72"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- waves -->
    <path d="M0 420 Q64 396 128 420 T256 420 T384 420 T512 420 V512 H0Z" fill="#0f2a3a"/>
    <path d="M0 450 Q64 430 128 450 T256 450 T384 450 T512 450 V512 H0Z" fill="#0b1f2c"/>
    <!-- bubbles -->
    <g fill="none" stroke="#5eead4" stroke-opacity=".35" stroke-width="3">
      <circle cx="78" cy="120" r="14"/><circle cx="108" cy="82" r="8"/><circle cx="440" cy="140" r="12"/><circle cx="418" cy="96" r="6"/><circle cx="62" cy="210" r="6"/>
    </g>
    <!-- tentacles -->
    <g fill="none" stroke="url(#arm)" stroke-width="30" stroke-linecap="round">
      <path d="M170 290 C120 330 70 330 74 380 C78 420 128 410 134 380"/>
      <path d="M205 310 C185 370 150 400 168 436"/>
      <path d="M256 322 C256 380 236 420 256 446"/>
      <path d="M307 310 C327 370 362 400 344 436"/>
      <path d="M342 290 C392 330 442 330 438 380 C434 420 384 410 378 380"/>
    </g>
    <!-- suckers -->
    <g fill="#c4b5fd" fill-opacity=".55">
      <circle cx="108" cy="352" r="5"/><circle cx="86" cy="372" r="4"/>
      <circle cx="404" cy="352" r="5"/><circle cx="426" cy="372" r="4"/>
      <circle cx="190" cy="372" r="4"/><circle cx="322" cy="372" r="4"/>
      <circle cx="252" cy="372" r="4"/>
    </g>
    <!-- head -->
    <path d="M110 250 C110 130 180 78 256 78 C332 78 402 130 402 250 C402 300 360 330 256 330 C152 330 110 300 110 250Z" fill="url(#body)"/>
    <path d="M150 160 C175 120 215 100 256 100" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
    <!-- spots -->
    <g fill="#1d8f89" fill-opacity=".45"><circle cx="300" cy="130" r="9"/><circle cx="332" cy="162" r="6"/><circle cx="212" cy="124" r="5"/></g>
    <!-- eyes -->
    <g>
      <ellipse cx="206" cy="232" rx="34" ry="38" fill="#f8fafc"/><ellipse cx="306" cy="232" rx="34" ry="38" fill="#f8fafc"/>
      <circle cx="216" cy="238" r="18" fill="#1e1b4b"/><circle cx="316" cy="238" r="18" fill="#1e1b4b"/>
      <circle cx="222" cy="231" r="6" fill="#fff"/><circle cx="322" cy="231" r="6" fill="#fff"/>
    </g>
    <!-- smile -->
    <path d="M222 288 Q256 312 290 288" fill="none" stroke="#134e4a" stroke-width="7" stroke-linecap="round"/>
    <!-- two little buddies holding the tentacle tips -->
    <g>
      <circle cx="134" cy="380" r="20" fill="#f59e0b"/><circle cx="127" cy="376" r="3.5" fill="#1e1b4b"/><circle cx="141" cy="376" r="3.5" fill="#1e1b4b"/>
      <path d="M126 386 Q134 392 142 386" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="378" cy="380" r="20" fill="#f472b6"/><circle cx="371" cy="376" r="3.5" fill="#1e1b4b"/><circle cx="385" cy="376" r="3.5" fill="#1e1b4b"/>
      <path d="M370 386 Q378 392 386 386" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- wordmark -->
    <text x="256" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="44" fill="#e8fffb" letter-spacing="1">Kraken<tspan fill="#5eead4">friends</tspan></text>
  </g>
</svg>
